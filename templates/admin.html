<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FacePass — Manage</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="icon" href="/static/img/icon.svg" type="image/svg+xml">
</head>
<body>
<div class="site" style="max-width: 640px">
  <header>
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M9 10h.01M15 10h.01M9.5 15a3.5 3.5 0 0 0 5 0"/></svg>
      FacePass · Manage
    </div>
    <a href="/">← Register</a>
  </header>

  <section class="card" id="login">
    <div class="field">
      <label for="key">Admin key (the ADMIN_KEY setting on Render)</label>
      <input id="key" type="password" autocomplete="current-password">
    </div>
    <div class="row" style="margin-top: 14px"><button class="btn" id="loginBtn">Open</button></div>
    <div class="msg" id="loginMsg"></div>
  </section>

  <section class="card" id="list" hidden>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <b id="count"></b>
      <button class="link-btn" id="logout">Lock</button>
    </div>
    <div class="people" id="people"></div>
  </section>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  let key = "";
  try { key = sessionStorage.getItem("fp-admin") || ""; } catch {}

  async function api(path, opts = {}) {
    const res = await fetch(path, { ...opts, headers: { "X-Admin-Key": key, ...(opts.headers || {}) } });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
    return data;
  }

  function render(people) {
    $("count").textContent = `${people.length} registered ${people.length === 1 ? "person" : "people"}`;
    const box = $("people");
    box.replaceChildren();
    for (const p of people) {
      const row = document.createElement("div");
      row.className = "person";
      const img = new Image();
      img.src = `/api/people/${p.id}/photo`;
      img.alt = "";
      const meta = document.createElement("div");
      meta.className = "meta";
      const b = document.createElement("b"); b.textContent = p.name;
      const s = document.createElement("span"); s.textContent = "Registered " + new Date(p.created_at * 1000).toLocaleString();
      meta.append(b, s);
      const del = document.createElement("button");
      del.className = "btn danger"; del.textContent = "Remove";
      del.onclick = async () => {
        if (!confirm(`Remove ${p.name}? They will no longer pass the scanner.`)) return;
        await api(`/api/people/${p.id}`, { method: "DELETE" });
        load();
      };
      row.append(img, meta, del);
      box.append(row);
    }
  }

  async function load() {
    try {
      const data = await api("/api/people");
      try { sessionStorage.setItem("fp-admin", key); } catch {}
      $("login").hidden = true; $("list").hidden = false;
      render(data.people);
    } catch (e) {
      $("login").hidden = false; $("list").hidden = true;
      if (key) { $("loginMsg").textContent = e.message; $("loginMsg").className = "msg show error"; }
    }
  }

  $("loginBtn").onclick = () => { key = $("key").value.trim(); load(); };
  $("key").onkeydown = (e) => { if (e.key === "Enter") $("loginBtn").click(); };
  $("logout").onclick = () => { key = ""; try { sessionStorage.removeItem("fp-admin"); } catch {} $("key").value = ""; load(); };
  if (key) load();
</script>
</body>
</html>
