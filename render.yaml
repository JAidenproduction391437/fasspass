services:
  - type: web
    name: facepass
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: MATCH_THRESHOLD
        value: "0.5"
      - key: ADMIN_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: facepass-db
          property: connectionString

databases:
  - name: facepass-db
    plan: free
    region: singapore
    databaseName: facepass
    user: facepass
